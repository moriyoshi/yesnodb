[package]
name = "yesno-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The yesnod plugin channel: host, client, and a C ABI over the client."

[lib]
# `staticlib` and `cdylib` alongside `rlib` because `cabi.rs` is consumed from C
# through `include/yesno_channel.h`. The cost is real and accepted: every
# workspace build links two extra artifacts for this crate. The alternative was a
# separate crate -- which is how `yesno-c` does it -- and that was rejected
# because `crate-type` cannot be feature-gated, so the choice is between paying
# this on every build or splitting the client away from the protocol it speaks.
# Keeping one crate keeps one implementation, which is the whole argument for
# having written the client here at all.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
yesno-core = { path = "../yesno-core" }
# Serving a pushed-down filter: `yesno-wire` decodes the expression a peer sent
# and `yesno-eval` runs it. **`yesno-eval` rather than `yesno-flight`**, which
# is where that evaluator lived until 2026-10-09: this crate builds a `cdylib`
# and a `staticlib` that C links, and reaching it through the Flight crate would
# have put tonic, prost and arrow in both for a dependency on none of them.
#
# One evaluator for both transports is the correctness claim. Flight and this
# channel must answer one filter identically, and the only way to be sure is for
# there to be one implementation rather than two that agree.
yesno-eval = { workspace = true }
yesno-wire = { workspace = true }
# The peer half: wire format, client and status codes. Split out so a peer can
# link it without the engine; this crate is the host half and needs both.
yesno-channel = { path = "../yesno-channel", version = "0.1.0" }
# The IPC channel. memmap2 maps the arena; libc is memfd_create, fcntl sealing and
# sendmsg, none of which has a dependency-free spelling. The protocol itself is
# `ipc.rs` in this crate and pulls in neither.
memmap2 = "0.9"
libc = "0.2"
bytemuck.workspace = true

[dev-dependencies]
# The scan test maps the arena as a peer would, through the descriptor.
memmap2 = "0.9"
# Already a normal dependency; repeated here because an integration test under
# `tests/` links only the crate's public API and its dev-dependencies, and the
# expression tests build a `SetExpr` to push down.
yesno-wire = { workspace = true }
