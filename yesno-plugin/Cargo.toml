[package]
name = "yesno-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Host side of the yesnod plugin ABI: a function table over a live Db."

[dependencies]
yesno-core = { path = "../yesno-core" }
# The dlopen wrapper. Chosen over raw `libc::dlopen` for one reason: it ties the
# handle's lifetime to a value, so a `Library` cannot be closed while a symbol
# taken from it is still reachable. We then deliberately never close it -- see
# `loader::LoadedPlugin` -- but the type is what makes that a decision rather
# than an omission.
libloading = "0.8"

[dev-dependencies]
# The load test opens the fixture plugin a second time to read back what it
# observed; dlopen refcounts the same image, so the statics are the ones the host
# just drove.
libloading = "0.8"
