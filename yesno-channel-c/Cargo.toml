[workspace]

[package]
name = "yesno-channel-c"
description = "Stable C ABI for the yesno plugin channel client"
version = "0.1.0"
edition = "2021"
# Its own workspace, exactly as `yesno-c` is, so a C consumer can build it
# without resolving the whole Rust workspace. The cost is that
# `cargo build --workspace` does not reach it, which is why it has a `gate.sh`
# wired into the main gate's client-gate step -- the same arrangement that
# exists because four client gates once lived only in CI and went green while
# broken for a week.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moriyoshi/yesnodb"

[lib]
name = "yesno_channel_c"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
yesno-plugin = { path = "../yesno-plugin" }

[dev-dependencies]
# Only the tests need a database to serve: they stand up a real channel server
# with `yesno_plugin::channel::serve_blocking` and drive the exported C
# functions against it. The library itself never opens a database -- that is the
# whole distinction from `yesno-c`.
yesno-core = { path = "../yesno-core" }

[profile.release]
# Unwind rather than abort, because every exported function catches panics at
# the boundary: unwinding across an FFI edge is undefined, and aborting would
# take the host process down for a fault this library can report instead.
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
