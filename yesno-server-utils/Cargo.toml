[package]
name = "yesno-server-utils"
description = "Backup and object-archive utilities for yesnod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "yesnoctl"
path = "src/bin/yesnoctl.rs"

[[bin]]
name = "yesno-archive"
path = "src/bin/yesno-archive.rs"

[dependencies]
yesno-core.workspace = true
yesno-server = { path = "../yesno-server", version = "0.1.0" }
bytes = "1"
aws-config = { version = "=1.8.3", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-ecs = { version = "=1.82.0", features = ["behavior-version-latest"] }
kube = { version = "=1.1.0", default-features = false, features = [
    "client",
    "rustls-tls",
    "ring",
] }
k8s-openapi = { version = "=0.25.0", features = ["v1_30"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
crc32c.workspace = true
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
object_store = { version = "0.13.2", features = ["aws"] }
prost = "0.14"
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "net",
    "time",
    "sync",
    "signal",
] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring"] }
tower = "0.5"
tracing.workspace = true
url = "2"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
winterbaume-core = "=0.2.0"
winterbaume-ecs = "=0.2.0"
tokio = { version = "1", features = ["net"] }
tokio-stream = { version = "0.1", features = ["net"] }
