syntax = "proto3";

package yesno.archive.v1;

// Durable sidecar state and object manifests. These messages are the archive
// format; neither cursors nor manifests are encoded as JSON.

enum SnapshotSource {
  SNAPSHOT_SOURCE_UNSPECIFIED = 0;
  SNAPSHOT_SOURCE_NETWORK = 1;
  SNAPSHOT_SOURCE_ZFS = 2;
  SNAPSHOT_SOURCE_BTRFS = 3;
  SNAPSHOT_SOURCE_EBS = 4;
  SNAPSHOT_SOURCE_LVM = 5;
}

message WalCursor {
  uint32 shard = 1;
  uint64 archived_lsn = 2;
  // SHA-256 chain tip at archived_lsn. A base snapshot establishes the first
  // value; every immutable WAL descriptor commits to the previous value and
  // the exact raw WAL bytes it names.
  bytes history_fingerprint = 3;
}

// A run of bytes of a base file that is actually present.
//
// Two shapes, distinguished by `content_hash`:
//
//   empty -- the run lives inside the file's single `ArchiveFile.object_key`,
//   which is the runs concatenated in this order. Offsets are into the file,
//   not into the object. Every archive written before slab objects existed
//   reads as this and still restores.
//
//   set -- the run is its own object, named by the SHA-256 below rather than
//   by a path the manifest spells out, and `ArchiveFile.object_key` is empty.
//   Identical bytes therefore land on one object however many files and
//   generations contain them, which is what makes a base generation
//   incremental.
message FileExtent {
  uint64 offset = 1;
  uint64 length = 2;
  // SHA-256 of exactly this run's bytes. The object's name, not a checksum:
  // truncating it would weaken the namespace, so it is stored whole and the
  // key is derived from it rather than stored beside it.
  bytes content_hash = 3;
  // A transport check over the same bytes, verified as the object arrives.
  // Cheaper than rehashing, and the whole file's CRC still has to agree
  // afterwards, so this exists to localize a bad fetch rather than to catch
  // one the file-level check would miss.
  uint32 crc32c = 4;
}

message ArchiveFile {
  string name = 1;
  // The one object holding this file, and empty when every extent names its
  // own. A reader that does not understand self-addressing extents fails to
  // fetch rather than reconstructing a file from the wrong bytes.
  string object_key = 2;
  // The file's length and CRC32C, holes included. These keep their meaning
  // whether or not the object carries the holes, which is what lets a restore
  // verify the file it reconstructs rather than the bytes it received, and
  // what keeps `BaseManifest.history_anchor` a commitment to content.
  uint64 size = 3;
  uint32 crc32c = 4;
  // False when one object is the file, byte for byte, and `extents` is empty.
  // Every archive written before sparse objects existed reads as this, and a
  // file with no holes stored whole is still written as this.
  //
  // True when the file is reconstructed from `extents` and every byte outside
  // them is zero. An empty `extents` under a true flag is a file that is
  // entirely zero, which is why the flag exists rather than being inferred
  // from the list being non-empty.
  //
  // Where those extents' bytes come from is `FileExtent.content_hash`'s
  // question, not this one: a sparse file in one object and a file cut into
  // content-addressed slabs are both `sparse = true`.
  //
  // Deliberately NOT part of `history_anchor`, for the reason
  // `checkpoint_time` gives below: adding a field to that hash would change
  // the fingerprint of every existing history. It needs no commitment of its
  // own -- `size` and `crc32c` already commit to the content, and an extent
  // list disagreeing with the file fails the CRC on the way in.
  bool sparse = 5;
  repeated FileExtent extents = 6;
}

message BaseManifest {
  uint32 schema_version = 1;
  bytes database_uuid = 2;
  uint32 term = 3;
  uint64 event_sequence = 4;
  uint64 checkpoint_version = 5;
  uint64 recovered_version = 6;
  SnapshotSource source = 7;
  repeated ArchiveFile files = 8;
  repeated WalCursor wal_cursors = 9;
  // Monotonic within this archive, including same-event-sequence rebootstrap.
  uint64 archive_generation = 10;
  // SHA-256 over the immutable base identity, file catalogue, and WAL cursor
  // positions. Per-shard cursor fingerprints are derived from this anchor.
  bytes history_anchor = 11;
  // An upper bound, in UNIX epoch microseconds, on the commit time of every
  // version at or below `checkpoint_version`. Zero means unknown: a base taken
  // before commit-time stamping existed.
  //
  // A bound rather than the watermark's own stamp, because that is what the
  // image persists -- and it is conservative in the safe direction: a base
  // selected because this value is at or below the target is guaranteed not to
  // sit above the target.
  //
  // A selection hint only. It narrows which base a wall-clock target starts
  // from without downloading every candidate; the times a restore actually cuts
  // on come from the WAL frames, which are hashed and verified. It is therefore
  // deliberately NOT part of `history_anchor` -- adding a field to that hash
  // would change the fingerprint of every existing history and break chain
  // continuity at the sidecar's next reconnect.
  uint64 checkpoint_time = 12;
}

message WalObject {
  uint32 schema_version = 1;
  bytes database_uuid = 2;
  uint32 term = 3;
  uint32 shard = 4;
  uint64 first_lsn = 5;
  uint64 last_lsn = 6;
  string object_key = 7;
  uint64 size = 8;
  uint32 crc32c = 9;
  bytes previous_fingerprint = 10;
  bytes history_fingerprint = 11;
  uint64 first_version = 12;
  uint64 last_version = 13;
  // Commit times bounding this object's frames, in UNIX epoch microseconds.
  // Zero means unknown, exactly as for BaseManifest.checkpoint_time, and for
  // the same reason these are excluded from `history_fingerprint`: they are a
  // selection hint, and the authority is the frames themselves.
  uint64 first_time = 14;
  uint64 last_time = 15;
}

message ArchiveState {
  uint32 schema_version = 1;
  bytes database_uuid = 2;
  uint64 event_sequence = 3;
  string latest_base_manifest = 4;
  repeated WalCursor wal_cursors = 5;
  // Highest leadership timeline accepted by this archive. A promoted copy has
  // the same database UUID, so UUID alone cannot fence an obsolete leader.
  uint32 term = 6;
  uint64 base_generation = 7;
  // Owner of the conditional writer lease that last published this state.
  // Every remote update is compare-and-swap, so a superseded writer cannot
  // advance a cursor after a replacement has fenced it.
  bytes writer_id = 8;
}

message ArchiveWriterLease {
  uint32 schema_version = 1;
  bytes owner_id = 2;
  uint64 expires_unix_millis = 3;
}
