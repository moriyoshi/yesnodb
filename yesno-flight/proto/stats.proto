syntax = "proto3";

package yesno.flight.v1;

// Space and reader counters returned by the Arrow Flight `stats` action.
message ServerStats {
  uint64 allocated_bytes = 1;
  uint64 deferred_bytes = 2;
  uint64 wal_bytes = 3;
  uint64 live_readers = 4;
  uint64 shards = 5;
  // Capability bitmask. A server predating this field reports zero, because
  // protobuf decodes an absent field as its default -- so a client must check
  // it before sending a `do_put` command the server may not know.
  //
  // Bit 0: mixed-operation `apply` streams.
  // Bit 1: write transactions spanning several calls.
  uint64 features = 6;
}
