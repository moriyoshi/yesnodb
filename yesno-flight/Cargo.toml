[package]
name = "yesno-flight"
description = "Arrow Flight service for yesno query results and bulk ingest"
version.workspace = true
edition.workspace = true
# The server's JIT is separate from its default feature. The PostgreSQL
# client-only Bazel target enables neither feature.
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["server"]
# The container wire, which needs `yesno-arrow`'s schema. Separated from `server` so a
# client can send container batches without linking the engine -- and so that the schema
# stays the single definition in `yesno-arrow` rather than being copied here, which is how
# two spellings of one wire format start to drift.
containers = ["dep:yesno-arrow"]
server = ["dep:yesno-core", "dep:yesno-arrow", "dep:tracing", "yesno-core/tracing", "containers"]
jit = ["server", "yesno-core/jit"]

[dependencies]
yesno-core = { workspace = true, optional = true }
yesno-arrow = { workspace = true, optional = true }
yesno-wire.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-flight = "59.2"
arrow-ipc = "59.2"
tonic = "0.14"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = "0.1"
prost = "0.14"
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[[test]]
name = "client"
required-features = ["server"]

[[test]]
name = "hotspot_capture"
required-features = ["server"]

[[test]]
name = "reactor"
required-features = ["server"]

[[test]]
name = "roundtrip"
required-features = ["server"]

[[test]]
name = "ticket_consistency"
required-features = ["server"]
