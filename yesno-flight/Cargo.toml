[package]
name = "yesno-flight"
description = "Arrow Flight service for yesno query results and bulk ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["server"]
server = ["dep:yesno-core", "dep:yesno-arrow", "dep:tracing", "yesno-core/tracing"]

[dependencies]
yesno-core = { workspace = true, optional = true }
yesno-arrow = { workspace = true, optional = true }
yesno-wire.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-flight = "59.2"
arrow-ipc = "59.2"
tonic = "0.14"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-stream = "0.1"
prost = "0.14"
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[[test]]
name = "client"
required-features = ["server"]

[[test]]
name = "reactor"
required-features = ["server"]

[[test]]
name = "roundtrip"
required-features = ["server"]

[[test]]
name = "ticket_consistency"
required-features = ["server"]
