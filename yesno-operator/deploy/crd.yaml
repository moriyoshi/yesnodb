                maximum: 600.0
                minimum: 0.0
                type: integer
              image:
                description: Container image containing `yesnod`.
                type: string
              imagePullPolicy:
                description: Kubernetes image pull policy. Defaults to `IfNotPresent`.
                nullable: true
                type: string
              instances:
