                          group:
                            default: cert-manager.io
                            type: string
                          kind:
                            default: Issuer
                            type: string
                          name:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - caSecretRef
                    - issuerRef
                    type: object
                  secretName:
                    description: Secret containing a `yesnod.toml` key and any files it references.
                    nullable: true
                    type: string
                type: object
              failoverDelaySecs:
                default: 30
                description: |-
                  How long a primary may remain unavailable before automatic failover.
                  Zero is useful for deterministic tests; production clusters should
                  leave time for an ordinary Pod restart.
